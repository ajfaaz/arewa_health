name: arewa_health
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  
  # Icons and Localization
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Firebase Suite
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_messaging: ^15.1.0

  # State Management
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # This flag is REQUIRED for flutter_localizations to generate files
  generate: true
  
  uses-material-design: true

